name: APK derle ve yayınla

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Gradle 8.14, JDK 25'i desteklemiyor — 21'de kal.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testler
        run: npm test

      - name: Web'i statik olarak derle
        run: npm run build

      - name: Capacitor senkronu
        run: npx cap sync android

      # gradlew depoda 100644 olarak duruyor, çalıştırma izni CI'da veriliyor
      - name: gradlew'e çalıştırma izni ver
        run: chmod +x android/gradlew

      # secrets adım if'inde kullanılamadığı için kontrol script içinde
      - name: İmza anahtarını hazırla
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::KEYSTORE_BASE64 yok; APK imzasız üretilecek."
          fi

      - name: APK derle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: APK'yı topla
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "dist/rabi-${GITHUB_REF_NAME}.apk"

      - name: Sürüm oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.apk
          generate_release_notes: true

      - name: Artefakt olarak yükle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rabi-apk
          path: dist/*.apk
