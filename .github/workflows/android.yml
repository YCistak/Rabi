name: APK derle ve yayınla

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      iz:
        description: 'Play izi (track). Etiketle tetiklemede varsayılan alpha (kapalı test).'
        type: choice
        options: [alpha, internal, beta, production]
        default: alpha

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      # Gradle 8.14, JDK 25'i desteklemiyor — 21'de kal.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Varsayılan paket listesi artık var olmayan 'tools' paketini istiyor ve
      # yeni runner imajında sdkmanager onunla düşüyor; yalnızca platform-tools.
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools'

      - run: npm ci

      # Play'in "yeni neler var" sınırı 500 karakter; aşılırsa yükleme en
      # sonda, derlemeden sonra patlıyor. Burada baştan durdur.
      - name: Sürüm notu uzunluğunu denetle
        run: |
          dosya=android/surum-notlari/whatsnew-tr-TR
          if [ ! -s "$dosya" ]; then
            echo "::error::$dosya yok ya da boş."; exit 1
          fi
          uzunluk=$(node -e "console.log([...require('fs').readFileSync(process.argv[1],'utf8').trim()].length)" "$dosya")
          echo "Sürüm notu: $uzunluk karakter (sınır 500)"
          if [ "$uzunluk" -gt 500 ]; then
            echo "::error::Sürüm notu $uzunluk karakter; Play sınırı 500."; exit 1
          fi

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testler
        run: npm test

      - name: Web'i statik olarak derle
        run: npm run build

      - name: Capacitor senkronu
        run: npx cap sync android

      # gradlew depoda 100644 olarak duruyor, çalıştırma izni CI'da veriliyor
      - name: gradlew'e çalıştırma izni ver
        run: chmod +x android/gradlew

      # secrets adım if'inde kullanılamadığı için kontrol script içinde
      - name: İmza anahtarını hazırla
        id: keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "path=$RUNNER_TEMP/release.jks" >> "$GITHUB_OUTPUT"
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            # Etiketli sürüm Play'e gidiyor; imzasız AAB'yi Play reddediyor ve
            # bu ancak Console'a yükleme denendiğinde fark ediliyor. Burada dur.
            echo "::error::KEYSTORE_BASE64 tanımlı değil — imzasız AAB Play'e yüklenemez."
            exit 1
          else
            echo "::warning::KEYSTORE_BASE64 yok; paketler imzasız üretilecek (yalnızca deneme)."
          fi

      # google-services.json depoda değil (herkese açık depo). Olmadan derleme
      # çalışmaya devam eder ama **çökme raporlaması olmadan** — ve CI'nin
      # ürettiği paketler Play'e giden paketler. Etiketli sürümde bu sessizce
      # olursa üretimde hiç rapor gelmez, o yüzden orada hata veriliyor.
      - name: Firebase yapılandırmasını yaz
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > android/app/google-services.json
            echo "google-services.json yazıldı."
          elif [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "::error::GOOGLE_SERVICES_JSON tanımlı değil — yayına giden pakette çökme raporlaması olmaz."
            exit 1
          else
            echo "::warning::GOOGLE_SERVICES_JSON yok; paketler çökme raporlaması olmadan derlenecek."
          fi

      # AAB Play'e yüklenen biçim, APK doğrudan kurulum (arkadaşlara dağıtım)
      # için. Play 2021'den beri yeni uygulamalarda APK kabul etmiyor, o yüzden
      # `bundleRelease` olmadan yayına çıkılamıyor.
      - name: AAB ve APK derle
        working-directory: android
        env:
          KEYSTORE_FILE: ${{ steps.keystore.outputs.path }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew bundleRelease assembleRelease --no-daemon

      - name: Çıktıları topla
        run: |
          mkdir -p dist
          APK=$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)
          cp "$APK" "dist/rabi-${GITHUB_REF_NAME}.apk"
          AAB=$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)
          cp "$AAB" "dist/rabi-${GITHUB_REF_NAME}.aab"

      # Play'e yükleme. Secret yoksa iş kırılmaz, adım atlanır; etiketli
      # sürümde bu açıkça uyarıyla duyurulur (sessizce atlanmasın).
      - name: Play yükleme ayarlarını hazırla
        id: play
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          KEYSTORE_YOL: ${{ steps.keystore.outputs.path }}
          GIRDI_IZ: ${{ inputs.iz }}
        run: |
          yukle=true
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then
            yukle=false
            if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
              echo "::warning::PLAY_SERVICE_ACCOUNT_JSON tanımlı değil — AAB Play'e YÜKLENMEDİ, elle yüklemen gerekiyor."
            else
              echo "::warning::PLAY_SERVICE_ACCOUNT_JSON yok; Play'e yükleme atlandı."
            fi
          elif [ -z "$KEYSTORE_YOL" ]; then
            yukle=false
            echo "::warning::Paket imzasız; Play'e yükleme atlandı."
          fi

          iz="${GIRDI_IZ:-alpha}"   # etiket tetiklemesinde girdi boş: kapalı test
          # Production'da `completed` değil `draft`: etiket yanlışlıkla canlıya
          # çıkmasın; taslak Console'da elle gözden geçirilip gönderilir.
          if [ "$iz" = "production" ]; then durum=draft; else durum=completed; fi

          paket=$(sed -nE 's/^[[:space:]]*applicationId "([^"]+)".*/\1/p' android/app/build.gradle)
          ad=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' android/app/build.gradle)
          if [ -z "$paket" ]; then echo "::error::applicationId okunamadı"; exit 1; fi

          mapping=android/app/build/outputs/mapping/release/mapping.txt
          if [ -f "$mapping" ]; then echo "mapping=$mapping" >> "$GITHUB_OUTPUT"
          else echo "mapping=" >> "$GITHUB_OUTPUT"; echo "Mapping dosyası yok, atlanıyor."; fi

          {
            echo "yukle=$yukle"
            echo "iz=$iz"
            echo "durum=$durum"
            echo "paket=$paket"
            echo "ad=$ad"
          } >> "$GITHUB_OUTPUT"
          echo "Play: iz=$iz durum=$durum paket=$paket yukle=$yukle"

      - name: Play'e yükle
        if: steps.play.outputs.yukle == 'true'
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: ${{ steps.play.outputs.paket }}
          releaseFiles: dist/rabi-${{ github.ref_name }}.aab
          releaseName: ${{ steps.play.outputs.ad }}
          track: ${{ steps.play.outputs.iz }}
          status: ${{ steps.play.outputs.durum }}
          whatsNewDirectory: android/surum-notlari
          mappingFile: ${{ steps.play.outputs.mapping }}

      - name: Sürüm oluştur
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.apk
            dist/*.aab
          generate_release_notes: true

      - name: Artefakt olarak yükle
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: rabi-paketler
          path: |
            dist/*.apk
            dist/*.aab
