name: iOS proje hedefleri

# `scripts/ios-eklenti-hedefleri.rb`i çalıştırıp değişen `project.pbxproj`i
# aynı dala geri commit'liyor. Depo Windows'ta geliştiriliyor ve orada ne Xcode
# ne Ruby var; proje dosyasını elle yazmak yerine Xcode'un biçimini bilen
# `xcodeproj` gem'i burada, macOS'ta çalışıyor.
#
# Betik değişince kendiliğinden tetikleniyor. Betik tekrar çalıştırılabilir:
# proje zaten günceliyse commit atılmıyor.

on:
  push:
    paths:
      - 'scripts/ios-eklenti-hedefleri.rb'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  hedefler:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: xcodeproj kur
        run: gem install xcodeproj --no-document

      - name: Hedefleri ekle
        run: ruby scripts/ios-eklenti-hedefleri.rb

      - name: Değişeni commit'le
        run: |
          if git diff --quiet -- ios/App/App.xcodeproj; then
            echo "Proje zaten güncel."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ios/App/App.xcodeproj
          git commit -m "iOS proje hedeflerini güncelle (ios-eklenti-hedefleri.rb)"
          git push
