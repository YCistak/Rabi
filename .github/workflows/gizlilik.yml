name: Gizlilik politikasını yayınla

# Google Play, gizlilik politikasının aktif, herkese açık, coğrafi kısıtsız ve
# düzenlenemez bir HTML adreste durmasını istiyor. Adres:
# https://ycistak.github.io/Rabi/
#
# Yayınlanan site üç sayfa: `index.html` (gizlilik politikası — adresi
# değişmez, Play'de kayıtlı), `sozlesme.html`, `veri-ozeti.html`. Aşağıdaki
# iş deponun geri kalanını değil `public/gizlilik/` klasörünü yüklüyor. Pages'i
# "master dalı + /docs klasörü" ile açmak daha kısa olurdu ama o zaman
# `docs/ekran` altındaki ekran görüntüleri de yayına girerdi.
#
# Metinlerin tek kaynağı bu klasör: uygulama içindeki Gizlilik ve Koşullar
# ekranı (`components/ekranlar/yasal.tsx`) metni göstermiyor, bu sayfaları
# tarayıcıda açıyor. Adresler `lib/veri/yasal.ts` içinde.

on:
  push:
    branches: [master]
    paths: ['public/gizlilik/**', '.github/workflows/gizlilik.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  # Pages dağıtımı OIDC ile kimlik doğruluyor; bu izin olmadan `deploy-pages`
  # yetkisiz hatası veriyor.
  id-token: write

# Aynı anda iki dağıtım olmasın; sonuncusu geçerli.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  yayinla:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dagitim.outputs.page_url }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          # Klasörün tamamı yükleniyor: index, sozlesme, veri-ozeti.
          path: public/gizlilik

      - id: dagitim
        uses: actions/deploy-pages@v4
