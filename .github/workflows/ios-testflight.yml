name: iOS'u TestFlight'a yükle

# Android'deki `v*` etiketi iOS'u da yayına hazırlıyor: aynı etiket, aynı
# derleme. TestFlight'a düşen derleme herkese açık değil; mağazaya ancak App
# Store Connect'ten elle incelemeye gönderilince çıkıyor.
#
# İmza elle yönetilmiyor: sertifika ve provisioning profili Apple'ın bulut
# imzalaması API anahtarıyla kendisi üretiyor (`-allowProvisioningUpdates`).
# `.p12` taşımak her yıl süresi dolan bir dosyayı secret'ta güncel tutmak
# demekti. Bunun bedeli anahtarın Admin yetkisinde olması.
#
# Gereken secret'lar:
#   APP_STORE_CONNECT_KEY        .p8 dosyasının içeriği (BEGIN/END satırları dahil)
#   APP_STORE_CONNECT_KEY_ID     anahtarın 10 haneli kimliği
#   APP_STORE_CONNECT_ISSUER_ID  App Store Connect › Users and Access › Integrations
#   APPLE_TEAM_ID                developer.apple.com › Membership, 10 hane

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      cihaz_udid:
        description: 'Hesaba kaydedilecek iPhone UDID (isteğe bağlı)'
        required: false
        default: ''
      cihaz_adi:
        description: 'Cihazın developer portalındaki adı'
        required: false
        default: 'Test iPhone'

jobs:
  testflight:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - run: npm ci

      - name: Tip kontrolü
        run: npm run typecheck

      - name: Birim testler
        run: npm test

      - name: Web'i statik olarak derle
        run: npm run build

      - name: Capacitor senkronu
        run: npx cap sync ios

      # Sürüm tek yerde yazılı: Android'in build.gradle'ı. iOS ondan okuyor,
      # yoksa iki mağazada aynı derleme iki ayrı numarayla dolaşırdı.
      #
      # Derleme numarası `versionCode.çalıştırma` — App Store aynı numarayı
      # ikinci kez kabul etmiyor ve yarıda kalan bir yüklemeyi aynı etiketle
      # yeniden denemek, yalnızca versionCode olsaydı reddedilirdi.
      - name: Sürümü oku
        id: surum
        run: |
          ad=$(sed -nE 's/^[[:space:]]*versionName "([^"]+)".*/\1/p' android/app/build.gradle)
          kod=$(sed -nE 's/^[[:space:]]*versionCode ([0-9]+).*/\1/p' android/app/build.gradle)
          if [ -z "$ad" ] || [ -z "$kod" ]; then
            echo "::error::build.gradle'dan sürüm okunamadı"; exit 1
          fi
          echo "ad=$ad" >> "$GITHUB_OUTPUT"
          echo "numara=$kod.$GITHUB_RUN_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Sürüm $ad ($kod.$GITHUB_RUN_NUMBER)"

      # Secret adım `if`inde okunamıyor, denetim betikte. Eksikse burada dur:
      # yoksa hata yirmi dakikalık derlemenin sonunda, imzada çıkar.
      - name: API anahtarını yaz
        env:
          ANAHTAR: ${{ secrets.APP_STORE_CONNECT_KEY }}
          ANAHTAR_KIMLIGI: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          YAYINCI: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EKIP: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for ad in ANAHTAR ANAHTAR_KIMLIGI YAYINCI EKIP; do
            if [ -z "${!ad}" ]; then echo "::error::$ad secret'ı eksik"; exit 1; fi
          done
          printf '%s\n' "$ANAHTAR" > "$RUNNER_TEMP/AuthKey.p8"

      # Hesabı API'yle hazırla: istenirse cihazı kaydet, üç kimlikte Family
      # Controls'ü açık tut. Ayrıntı ve gerekçe betiğin başında.
      - name: Apple hesabını hazırla
        env:
          ANAHTAR_KIMLIGI: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          YAYINCI: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          CIHAZ_UDID: ${{ github.event.inputs.cihaz_udid }}
          CIHAZ_ADI: ${{ github.event.inputs.cihaz_adi }}
        run: |
          python3 -m venv "$RUNNER_TEMP/py"
          "$RUNNER_TEMP/py/bin/pip" install -q pyjwt cryptography
          "$RUNNER_TEMP/py/bin/python" scripts/app-store-hazirla.py

      # Arşiv **otomatik imzayla** (geliştirme) alınıyor, dışa aktarma onu
      # App Store dağıtım imzasıyla yeniden imzalıyor — Xcode'un kendi akışı.
      #
      # Geliştirme profili hesapta en az bir kayıtlı iPhone istiyor; o yüzden
      # developer.apple.com › Devices'ta bir cihaz kayıtlı. Silinirse arşiv
      # "Your team has no devices" ile düşer.
      #
      # Denenip düşen kısa yollar:
      # - İmzasız arşiv (`CODE_SIGNING_ALLOWED=NO`) derleniyor ama yetkiler
      #   imzaya hiç girmiyor; dışa aktarma da eklemiyor. Screen Time yetkisi
      #   sessizce düşüyordu — aşağıdaki denetim adımı bunu yakaladı.
      # - Ad-hoc imza (`CODE_SIGN_IDENTITY=-`): iOS 26 SDK'sı reddediyor.
      # - Komut satırından "Apple Distribution": SPM paketleriyle
      #   "conflicting provisioning settings".
      - name: Arşivle
        env:
          ANAHTAR_KIMLIGI: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          YAYINCI: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EKIP: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Rabi.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ANAHTAR_KIMLIGI" \
            -authenticationKeyIssuerID "$YAYINCI" \
            DEVELOPMENT_TEAM="$EKIP" \
            CODE_SIGN_STYLE=Automatic \
            MARKETING_VERSION="${{ steps.surum.outputs.ad }}" \
            CURRENT_PROJECT_VERSION="${{ steps.surum.outputs.numara }}"

      # Dışa aktarma iki kez: önce diske (denetim için), sonra yüklemeye.
      # Yükleme `destination: upload` ile tek adımda yapılıyor ve arkasında
      # denetlenecek bir paket bırakmıyor; ilk geçiş o paketi veriyor.
      - name: İmzala ve dışa aktar
        env:
          ANAHTAR_KIMLIGI: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          YAYINCI: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          EKIP: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for hedef in export upload; do
            cat > "$RUNNER_TEMP/ExportOptions-$hedef.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$hedef</string>
            <key>teamID</key><string>$EKIP</string>
            <key>signingStyle</key><string>automatic</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          PLIST
          done
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Rabi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" \
            -exportPath "$RUNNER_TEMP/cikti" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ANAHTAR_KIMLIGI" \
            -authenticationKeyIssuerID "$YAYINCI"

      # Odak kilidi Screen Time yetkisi olmadan cihazda sessizce çalışmıyor:
      # izin penceresi hiç çıkmıyor ve hata da vermiyor. Yetki uygulamada ve iki
      # eklentide de imzanın içinde olmalı; biri eksikse yükleme yapılmıyor.
      - name: Screen Time yetkisini denetle
        run: |
          cd "$RUNNER_TEMP/cikti"
          # Ad sabit yazılmıyor: paket adı CFBundleName'den geliyor ve "App"ten
          # "Rabi"ye döndüğünde denetim dosyayı bulamayıp düşmüştü.
          ipa=$(ls *.ipa | head -1)
          unzip -q -o "$ipa" -d paket
          uygulama=$(ls -d paket/Payload/*.app | head -1)
          eksik=0
          for parca in "$uygulama" "$uygulama"/PlugIns/*.appex; do
            if codesign -d --entitlements :- "$parca" 2>/dev/null | grep -q "com.apple.developer.family-controls"; then
              echo "✓ $(basename "$parca")"
            else
              echo "::error::$(basename "$parca") Screen Time yetkisi taşımıyor"
              eksik=1
            fi
          done
          ls "$uygulama"/PlugIns/ | grep -q appex || { echo "::error::Eklentiler pakette yok"; eksik=1; }
          exit $eksik

      - name: TestFlight'a yükle
        env:
          ANAHTAR_KIMLIGI: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          YAYINCI: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Rabi.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" \
            -exportPath "$RUNNER_TEMP/yukleme" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ANAHTAR_KIMLIGI" \
            -authenticationKeyIssuerID "$YAYINCI"

      - name: Anahtarı sil
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
