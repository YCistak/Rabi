<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 190" width="600" height="190" font-family="DejaVu Sans, sans-serif"><rect width="600" height="190" fill="#ffffff"/><rect x="30" y="10" width="540" height="170" fill="#fffdf5" stroke="#222222" stroke-width="2" rx="10"/><text x="300" y="40" font-size="18" text-anchor="middle" font-weight="bold" fill="#1f5fa8">İŞ İLANI</text><text x="50" y="70" font-size="14" text-anchor="start" font-weight="bold" fill="#222222">Aranan pozisyon:</text><text x="190" y="70" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Aroma kimyageri (lisans)</text><text x="50" y="100" font-size="14" text-anchor="start" font-weight="bold" fill="#222222">Görev tanımı:</text><text x="180" y="100" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Çilekli yoğurdun çilek aromasını doğal özlerle</text><text x="180" y="120" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">güçlendirmek ve üretilen ürünlerin kalite</text><text x="180" y="140" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">kontrolünü yapmak.</text></svg>