<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 290" width="600" height="290" font-family="DejaVu Sans, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker><marker id="ak" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#222222"/></marker></defs><rect width="600" height="290" fill="#ffffff"/><text x="48" y="150" font-size="15" text-anchor="middle" font-weight="bold" fill="#222222" transform="rotate(-90 48 150)">NANOTEKNOLOJİ</text><rect x="85" y="30" width="490" height="64" fill="#fff" stroke="#1f5fa8" stroke-width="2.5" rx="14"/><circle cx="105" cy="48" r="12" fill="#a9c8ec" stroke="#1f5fa8" stroke-width="1.5"/><text x="105" y="53" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">I</text><text x="130" y="68" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Boyutları 1–100 nm olan maddeler üzerinde çalışır.</text><rect x="85" y="115" width="490" height="64" fill="#fff" stroke="#c0392b" stroke-width="2.5" rx="14"/><circle cx="105" cy="133" r="12" fill="#a9c8ec" stroke="#c0392b" stroke-width="1.5"/><text x="105" y="138" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">II</text><text x="130" y="153" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Yalnızca kimya disiplininin çalışma alanıdır.</text><rect x="85" y="200" width="490" height="64" fill="#fff" stroke="#2e8b57" stroke-width="2.5" rx="14"/><circle cx="105" cy="218" r="12" fill="#a9c8ec" stroke="#2e8b57" stroke-width="1.5"/><text x="105" y="223" font-size="12" text-anchor="middle" font-weight="bold" fill="#222222">III</text><text x="130" y="238" font-size="14" text-anchor="start" font-weight="normal" fill="#222222">Tıp, enerji ve çevre alanlarında uygulamaları vardır.</text></svg>