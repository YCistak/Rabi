<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 170" width="600" height="170" font-family="DejaVu Sans, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker></defs><rect width="600" height="170" fill="#ffffff"/><rect x="30" y="24" width="170" height="120" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="115" y="48" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f5fa8">X</text><text x="115" y="74" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">Katyon ve anyonlardan</text><text x="115" y="95" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">oluşan, kristal örgülü</text><text x="115" y="116" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">bir bileşiktir.</text><rect x="220" y="24" width="170" height="120" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="305" y="48" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Y</text><text x="305" y="74" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">Aynı tür ametal</text><text x="305" y="95" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">atomlarından oluşan,</text><text x="305" y="116" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">oda koşullarında gazdır.</text><rect x="410" y="24" width="170" height="120" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="495" y="48" font-size="20" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Z</text><text x="495" y="74" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">Farklı tür ametal</text><text x="495" y="95" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">atomlarından oluşan</text><text x="495" y="116" font-size="12.5" text-anchor="middle" font-weight="normal" fill="#222222">bir moleküldür.</text></svg>