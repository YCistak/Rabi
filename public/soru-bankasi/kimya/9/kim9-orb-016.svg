<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 250" width="600" height="250" font-family="DejaVu Sans, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker></defs><rect width="600" height="250" fill="#ffffff"/><text x="300" y="24" font-size="14" text-anchor="middle" font-weight="bold" fill="#222222">p orbital türü ile ilgili ifadeler</text><rect x="20" y="44" width="180" height="86" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="110" y="64" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Kart 1</text><text x="110" y="86" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">Üç tane eş enerjili</text><text x="110" y="102" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">orbitali vardır.</text><rect x="213" y="44" width="180" height="86" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="303" y="64" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Kart 2</text><text x="303" y="86" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">1. enerji düzeyinde</text><text x="303" y="102" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">bulunur.</text><rect x="406" y="44" width="180" height="86" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="496" y="64" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Kart 3</text><text x="496" y="86" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">En fazla 6 elektron</text><text x="496" y="102" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">alabilir.</text><rect x="20" y="144" width="180" height="86" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="110" y="164" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Kart 4</text><text x="110" y="186" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">Enerjisi, aynı</text><text x="110" y="202" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">düzeydeki s'ninkinden</text><text x="110" y="218" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">düşüktür.</text><rect x="213" y="144" width="180" height="86" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="303" y="164" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Kart 5</text><text x="303" y="186" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">2. enerji düzeyinden</text><text x="303" y="202" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">itibaren bulunur.</text><rect x="406" y="144" width="180" height="86" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="1.8" rx="8"/><text x="496" y="164" font-size="12" text-anchor="middle" font-weight="bold" fill="#1f5fa8">Kart 6</text><text x="496" y="186" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">Küresel simetrik bir</text><text x="496" y="202" font-size="12" text-anchor="middle" font-weight="normal" fill="#222222">yapıdadır.</text></svg>