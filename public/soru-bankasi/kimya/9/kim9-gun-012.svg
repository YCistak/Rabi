<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 334" width="600" height="334" font-family="DejaVu Sans, sans-serif"><rect width="600" height="334" fill="#fff"/><rect x="20" y="12" width="560" height="96" rx="10" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="2"/><text x="36" y="40" font-size="19" text-anchor="start" font-weight="bold" fill="#1f5fa8">1. gözlem</text><text x="36" y="67" font-size="19" text-anchor="start" font-weight="normal" fill="#222222">Semaverdeki kireç tabakası, sirkeli suda</text><text x="36" y="90" font-size="19" text-anchor="start" font-weight="normal" fill="#222222">bekletilince gaz çıkararak çözündü.</text><rect x="20" y="118" width="560" height="96" rx="10" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="2"/><text x="36" y="146" font-size="19" text-anchor="start" font-weight="bold" fill="#1f5fa8">2. gözlem</text><text x="36" y="173" font-size="19" text-anchor="start" font-weight="normal" fill="#222222">Yağlı fırın camı NaOH içeren jelle temizlendi;</text><text x="36" y="196" font-size="19" text-anchor="start" font-weight="normal" fill="#222222">jelin değdiği çıplak el tahriş oldu.</text><rect x="20" y="224" width="560" height="96" rx="10" fill="#f3f7fc" stroke="#1f5fa8" stroke-width="2"/><text x="36" y="252" font-size="19" text-anchor="start" font-weight="bold" fill="#1f5fa8">3. gözlem</text><text x="36" y="279" font-size="19" text-anchor="start" font-weight="normal" fill="#222222">Küften kararan duvar derzi, NaClO içeren</text><text x="36" y="302" font-size="19" text-anchor="start" font-weight="normal" fill="#222222">sprey sıkılınca beyazladı.</text></svg>
