<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" width="600" height="350" font-family="DejaVu Sans, sans-serif"><defs><marker id="ah" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#c0392b"/></marker></defs><rect width="600" height="350" fill="#ffffff"/><text x="300" y="22" font-size="13" text-anchor="middle" font-weight="normal" fill="#6b7480">Doruk'un adlandırmasına yapılan yorumlar</text><rect x="30" y="36" width="540" height="54" fill="#fffdf4" stroke="#c9a227" stroke-width="1.4" rx="8"/><text x="60" y="67" font-size="15" text-anchor="start" font-weight="bold" fill="#1f5fa8">Defne</text><text x="150" y="60" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">Azotun yükseltgenme basamağı 4 olduğundan</text><text x="150" y="79" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">Roma rakamı doğru yazılmıştır.</text><rect x="30" y="98" width="540" height="54" fill="#fffdf4" stroke="#c9a227" stroke-width="1.4" rx="8"/><text x="60" y="129" font-size="15" text-anchor="start" font-weight="bold" fill="#1f5fa8">Ege</text><text x="150" y="122" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">Her iki elemente de ön ek gelir;</text><text x="150" y="141" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">ad monoazot dioksit olmalıdır.</text><rect x="30" y="160" width="540" height="54" fill="#fffdf4" stroke="#c9a227" stroke-width="1.4" rx="8"/><text x="60" y="191" font-size="15" text-anchor="start" font-weight="bold" fill="#1f5fa8">Selin</text><text x="150" y="184" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">NO₂ kovalent bağlıdır; atom sayıları</text><text x="150" y="203" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">Latince ön eklerle belirtilir: azot dioksit.</text><rect x="30" y="222" width="540" height="54" fill="#fffdf4" stroke="#c9a227" stroke-width="1.4" rx="8"/><text x="60" y="253" font-size="15" text-anchor="start" font-weight="bold" fill="#1f5fa8">Kaan</text><text x="150" y="246" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">Oksijenin değerliği değişkendir;</text><text x="150" y="265" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">O'nun yanına Roma rakamı yazılmalıdır.</text><rect x="30" y="284" width="540" height="54" fill="#fffdf4" stroke="#c9a227" stroke-width="1.4" rx="8"/><text x="60" y="315" font-size="15" text-anchor="start" font-weight="bold" fill="#1f5fa8">Mert</text><text x="150" y="308" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">Önce anyon, sonra katyon okunur;</text><text x="150" y="327" font-size="13.5" text-anchor="start" font-weight="normal" fill="#222222">ad oksit azot olmalıdır.</text></svg>