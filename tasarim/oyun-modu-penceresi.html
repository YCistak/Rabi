<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Oyun Modunu Seç</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --background: #f8f8f7;
    --foreground: #1b1a19;
    --card: #ffffff;
    --muted: #efeeeb;
    --muted-foreground: #6b6764;
    --border: #eae9e6;
    --primary: #b3491f;
    --primary-parlak: #d9622f;
    /* Simge kutularının pastelleri — globals.css'teki genel aileler */
    --isl: #f7f0e1;
    --yzm: #f9ebee;
    --fzk: #e8eaf3;
    --cog: #e9f1e9;
    --isl-koyu: #a87c24;
    --yzm-koyu: #b4523c;
    --fzk-koyu: #4a5789;
    --cog-koyu: #4a7a52;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Nunito', system-ui, sans-serif;
    background: #e9e7e3;
    color: var(--foreground);
    min-height: 100vh;
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 16px; gap: 16px;
    -webkit-user-select: none; user-select: none;
  }
  .ust-not { font-size: 13px; color: var(--muted-foreground); text-align: center; max-width: 390px; }
  .ust-not b { color: var(--foreground); }
  .anahtar { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
  .anahtar button { font: inherit; font-size: 13px; font-weight: 800; border: 0; background: none; padding: 8px 14px; border-radius: 8px; color: var(--muted-foreground); cursor: pointer; }
  .anahtar button[aria-pressed="true"] { background: var(--muted); color: var(--foreground); }

  .telefon {
    position: relative;
    width: 100%; max-width: 390px; height: 844px;
    background: var(--background);
    border-radius: 36px;
    box-shadow: 0 0 0 10px #1b1a19, 0 20px 50px rgba(0,0,0,.25);
    overflow: hidden;
  }
  /* Arkada kalan oyun listesi — yalnızca yer tutucu */
  .arka { padding: 52px 20px 20px; filter: blur(2px); }
  .arka h3 { font-size: 22px; font-weight: 800; }
  .arka-liste { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .arka-kart { height: 110px; border-radius: 18px; background: var(--card); }

  .perde {
    position: absolute; inset: 0;
    background: rgba(27, 26, 25, .45);
    display: flex; align-items: center; justify-content: center;
    padding: 20px;
  }
  .perde { transition: opacity .18s ease; }
  .perde[hidden] { display: flex; opacity: 0; pointer-events: none; }
  .perde .pencere { transition: transform .18s ease; }
  .perde[hidden] .pencere { transform: scale(.96); }
  .yeniden {
    position: absolute; left: 50%; bottom: 40px; transform: translateX(-50%);
    font: inherit; font-size: 14px; font-weight: 800; cursor: pointer;
    border: 0; border-radius: 12px; padding: 12px 18px;
    background: var(--foreground); color: #fff;
  }
  .yeniden[hidden] { display: none; }
  .pencere {
    position: relative;
    width: 100%;
    background: var(--card);
    border-radius: 28px;
    padding: 30px 18px 20px;
    box-shadow: 0 16px 48px rgba(0,0,0,.2);
  }
  /* Uygulamadaki pencerelerin kapatma düğmesi (Ayarlar, Soru ekle): soluk gri kare, yumuşak köşe */
  .kapat {
    position: absolute; top: 14px; right: 14px;
    width: 36px; height: 36px; display: grid; place-items: center;
    border: 0; border-radius: 12px; background: rgba(239, 238, 235, .7); color: var(--muted-foreground); cursor: pointer;
  }
  .kapat:active { background: var(--muted); }
  h1 { text-align: center; font-size: 23px; font-weight: 900; letter-spacing: -0.01em; line-height: 1.2; }

  .rabi { display: block; height: 88px; width: auto; margin: 0 auto 10px; }
  .modlar { margin-top: 16px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .mod {
    font: inherit; color: inherit; cursor: pointer;
    background: var(--card);
    border: 1.5px solid #dad7d1;
    box-shadow: 0 2px 6px rgba(27,26,25,.07);
    border-radius: 20px;
    padding: 20px 10px 18px;
    display: flex; flex-direction: column; align-items: center; text-align: center;
    transition: background-color .15s, border-color .15s;
  }
  .mod:active { filter: brightness(.97); }
  .mod[aria-pressed="true"] { background: var(--zemin); border-color: var(--koyu); box-shadow: 0 0 0 1px var(--koyu), 0 4px 12px rgba(27,26,25,.10); }
  .simge {
    width: 52px; height: 52px;
    display: grid; place-items: center;
    font-size: 40px; line-height: 1;
  }
  .mod-ad { white-space: nowrap; margin-top: 12px; font-size: 15px; font-weight: 800; line-height: 1.2; }
  .mod-aciklama { white-space: nowrap; margin-top: 3px; font-size: 11.5px; font-weight: 600; line-height: 1.35; color: var(--muted-foreground); }
  .mod[aria-pressed="true"] .mod-ad,
  .mod[aria-pressed="true"] .mod-aciklama { color: var(--koyu); }

  /* Konu sahnesindeki karar düğmelerinin dili (.sahne-dugme): altta kalın kenar, basınca gömülür */
  .baslat {
    margin-top: 20px; margin-bottom: 5px;
    font: inherit; cursor: pointer; width: 100%; min-height: 56px; border: 0; border-radius: 16px;
    background: var(--primary-parlak); color: #fff; font-size: 18px; font-weight: 900;
    display: flex; align-items: center; justify-content: center; gap: 8px;
    box-shadow: 0 5px 0 var(--primary);
    transition: transform .08s, box-shadow .08s;
  }
  .baslat:active { transform: translateY(3px); box-shadow: 0 2px 0 var(--primary); }
  svg { display: block; }
</style>
</head>
<body>
  <p class="ust-not"><b>Oyun modunu seç</b> — örnek görselin düzeni, Rabi'nin renkleri ve mod adlarıyla. Seçili kart modun kendi rengine boyanır. Pencere ✕ ile, karanlık alana dokunarak ya da geri tuşuyla (burada Esc) kapanır.</p>

        <h1 id="baslik">Oyun modunu seç</h1>

        <div class="modlar" id="modlar"></div>

        <button type="button" class="baslat">
          Başla
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"/><path d="m12 5 7 7-7 7"/></svg>
        </button>
      </div>
    </div>
    <button type="button" class="yeniden" id="yeniden" hidden>Pencereyi yeniden aç</button>
  </div>

<script>
  // Ad ve emoji uygulamadaki gibi: `lib/oyunlar/mod.ts`
  const MODLAR = [
    { id: 'siradan', ad: 'Sıradan', emoji: '⏳', renk: 'isl', aciklama: '60 saniye' },
    { id: 'turbo', ad: 'Turbo', emoji: '⚡', renk: 'yzm', aciklama: '30 saniye' },
    { id: 'ani-olum', ad: 'Sıfır Tolerans', emoji: '🎯', renk: 'fzk', aciklama: 'Tek yanlış' },
    { id: 'rahat', ad: 'Rahat', emoji: '🌿', renk: 'cog', aciklama: 'Süresiz' },
  ];

  let mod = 'siradan';

  function ciz() {
    document.getElementById('modlar').innerHTML = MODLAR.map((m) =>
      `<button type="button" class="mod" data-mod="${m.id}" aria-pressed="${m.id === mod}" style="--zemin:var(--${m.renk});--koyu:var(--${m.renk}-koyu)">
        <span class="simge" aria-hidden="true">${m.emoji}</span>
        <span class="mod-ad">${m.ad}</span>
        <span class="mod-aciklama">${m.aciklama}</span>
      </button>`
    ).join('');
  }

  const perde = document.getElementById('perde');
  const yeniden = document.getElementById('yeniden');
  function kapat() { perde.hidden = true; yeniden.hidden = false; }
  function ac() { perde.hidden = false; yeniden.hidden = true; }

  document.addEventListener('click', (e) => {
    const m = e.target.closest('[data-mod]');
    if (m) { mod = m.dataset.mod; ciz(); return; }
    if (e.target.closest('[data-kapat]')) return kapat();
    // Pencerenin dışına, karartılmış alana dokunmak kapatır
    if (e.target === perde) return kapat();
    if (e.target === yeniden) return ac();
  });
  // Android'in geri tuşu uygulamada pencereyi kapatır; burada Esc onun yerine
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && !perde.hidden) kapat(); });

  ciz();
</script>
</body>
