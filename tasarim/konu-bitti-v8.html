<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Konu Bitti v8 · Matematik</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
  /*
    Konu bitti ekranı, v5 taslağı: yoklama kapanışının (soru-sahnesi.tsx → Kapanis,
    globals.css → .kapanis) dili, matematiğin renkleriyle. Kapanıştaki altın tonların
    yerini --konu-matematik ailesi alıyor; çizgili defter yerine kareli defter.
  */
  :root {
    --zemin: #e9f2fc;                       /* --konu-matematik */
    --cizgi: rgba(39, 91, 145, 0.07);
    --vurgu: #3574b3;                       /* --konu-matematik-ok; kapanışta --kapanis-altin */
    --vurgu-koyu: #275b91;                  /* --konu-matematik-koyu */
    --cerceve: #cbdff3;                     /* --konu-matematik-kenar */
    --halka-zemin: #f7fbff;
    --yazi: #1b1a19; --yazi-govde: #33302c; --soluk: #6b6764;
    --golge: 0 6px 20px rgba(39, 91, 145, 0.08);
    --halka-boyu: 150px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: Nunito, system-ui, sans-serif; color: var(--yazi); background: #e4e6ea;
         min-height: 100vh; display: flex; justify-content: center; align-items: center; padding: 24px 16px;
         -webkit-font-smoothing: antialiased; }
  .telefon { width: 390px; max-width: 100%; height: 844px; max-height: calc(100vh - 48px);
             border-radius: 44px; box-shadow: 0 0 0 10px #1b1a19, 0 30px 60px rgba(0,0,0,.25);
             overflow: hidden; display: flex; flex-direction: column;
             background-color: var(--zemin);
             /* Kareli defter: 22 pikselde bir, iki yönde bir piksel. */
             background-image:
               repeating-linear-gradient(to bottom, var(--cizgi) 0 1px, transparent 1px 22px),
               repeating-linear-gradient(to right, var(--cizgi) 0 1px, transparent 1px 22px); }
  .rakam { font-variant-numeric: tabular-nums; }

  header { flex-shrink: 0; padding: 54px 16px 0; text-align: center; }
  header .ust { font-size: 10.5px; font-weight: 800; letter-spacing: .14em; color: var(--vurgu); text-transform: uppercase; }
  header h2 { margin-top: 2px; font-size: 16px; line-height: 1.25; font-weight: 800; letter-spacing: -.02em; text-wrap: balance; }

  .kaydir { flex: 1; min-height: 0; overflow-y: auto; padding: 0 20px; display: flex; flex-direction: column; scrollbar-width: none; }
  .kaydir::-webkit-scrollbar { display: none; }
  .ic { margin: auto 0; padding: 8px 0; }

  .gel { animation: gel 520ms cubic-bezier(.16,1,.3,1) both; }
  @keyframes gel { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
  .orta { display: flex; flex-direction: column; align-items: center; }
  /* Tavşan büyük ve kıpırdamadan duruyor; halka yok. */
  .maskot { position: relative; width: 100%; height: 100%; }
  .maskot img { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 12px rgba(31,36,48,.16)); }

  .halka-kutu { position: relative; display: grid; place-items: center; width: var(--halka-boyu); height: var(--halka-boyu); }
  h3 { margin-top: 12px; text-align: center; font-size: 23px; font-weight: 900; letter-spacing: -.025em; }

  .kutular { margin-top: 16px; display: flex; gap: 10px; }
  .kutu { flex: 1; border: 1px solid var(--cerceve); background: #fff; border-radius: 16px; padding: 10px 8px;
          text-align: center; box-shadow: var(--golge); }
  .kutu .d { font-size: 22px; line-height: 1; font-weight: 900; color: var(--vurgu-koyu); }
  .kutu .e { margin-top: 4px; font-size: 10.5px; font-weight: 800; letter-spacing: .08em; color: var(--soluk); text-transform: uppercase; }

  .kart { margin-top: 10px; border: 1px solid var(--cerceve); background: #fff; border-radius: 18px; box-shadow: var(--golge); overflow: hidden; }
  .kart-bas { display: flex; align-items: center; justify-content: space-between; padding: 12px 16px 4px; }
  .kart-bas p { font-size: 10px; font-weight: 800; letter-spacing: .18em; color: var(--soluk); text-transform: uppercase; }
  .kart-bas .adet { font-size: 11.5px; font-weight: 800; color: var(--vurgu-koyu); background: var(--zemin); border-radius: 999px; padding: 2px 8px; }
  ol { list-style: none; }
  li { display: flex; align-items: flex-start; gap: 10px; padding: 6px 16px; }
  li .no { flex-shrink: 0; display: grid; place-items: center; width: 20px; height: 20px; margin-top: 1px; border-radius: 7px;
           background: var(--zemin); color: var(--vurgu-koyu); font-size: 11px; font-weight: 900; }
  li .ad { font-size: 13px; line-height: 1.375; font-weight: 700; color: var(--yazi-govde); }
  #liste-ilk { padding-bottom: 4px; transition: padding 260ms; }
  .kart[data-acik="true"] #liste-ilk { padding-bottom: 0; }
  .govde { display: grid; grid-template-rows: 0fr; transition: grid-template-rows 260ms cubic-bezier(.2,.7,.3,1); }
  .kart[data-acik="true"] .govde { grid-template-rows: 1fr; }
  .govde > div { min-height: 0; overflow: hidden; }
  #liste-kalan { padding-bottom: 4px; }
  .kart[data-acik="true"] #liste-kalan li { animation: liGel 260ms cubic-bezier(.2,.7,.3,1) both; }
  @keyframes liGel { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  .devam { width: 100%; display: flex; align-items: center; justify-content: center; gap: 6px; padding: 10px 16px 12px;
           border: 0; border-top: 1px solid #eef3f9; background: none; font: 800 13px Nunito, sans-serif; color: var(--vurgu-koyu); cursor: pointer; }
  .devam:active { background: #f4f8fd; }
  .devam .ok { transition: transform 240ms cubic-bezier(.2,.7,.3,1); }
  .kart[data-acik="true"] .devam .ok { transform: rotate(180deg); }

  .not { padding: 12px 16px; display: flex; gap: 10px; align-items: flex-start; }
  .not .i { flex-shrink: 0; display: grid; place-items: center; width: 20px; height: 20px; margin-top: 1px; border-radius: 7px;
            background: var(--vurgu); color: #fff; font-size: 12px; font-weight: 900; }
  .not .b { font-size: 10px; font-weight: 800; letter-spacing: .14em; color: var(--vurgu); text-transform: uppercase; }
  .not .m { margin-top: 2px; font-size: 13px; line-height: 1.375; font-weight: 700; color: var(--yazi-govde); }

  .alt { flex-shrink: 0; padding: 8px 16px 22px; }
  .buton { width: 100%; height: 56px; display: inline-flex; align-items: center; justify-content: center; gap: 10px;
           border: 0; border-radius: 18px; background: var(--vurgu); color: #fff; font: 800 16.5px Nunito, sans-serif;
           box-shadow: 0 3px 0 var(--vurgu-koyu); cursor: pointer; transition: transform 80ms, box-shadow 80ms; }
  .buton:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--vurgu-koyu); }
  .buton .ok { display: grid; place-items: center; width: 26px; height: 26px; border-radius: 9px; background: rgba(255,255,255,.18); }
  .yazi { margin-top: 2px; width: 100%; padding: 10px 0 0; border: 0; background: none; font: 700 13.5px Nunito, sans-serif;
          color: var(--soluk); cursor: pointer; }
  .yazi:active { color: var(--yazi); }

  @media (max-height: 680px) { :root { --halka-boyu: 112px; } }
  @media (prefers-reduced-motion: reduce) {
    .gel, .kart[data-acik="true"] #liste-kalan li { animation: none; }
    .govde, .devam .ok { transition: none; }
  }
  @media (max-width: 430px) { body { padding: 0; }
    .telefon { width: 100%; height: 100vh; max-height: none; border-radius: 0; box-shadow: none; } }
</style>
</head>

        <div class="govde" id="liste-govde"><div><ol id="liste-kalan"></ol></div></div>
        <button class="devam" type="button" aria-expanded="false" aria-controls="liste-govde" id="devam">
          <span id="devam-yazi">Devamını gör</span>
          <svg class="ok" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m6 9 6 6 6-6"/></svg>
        </button>
      </div>

      <div class="kart gel" style="animation-delay:1380ms">
        <div class="not">
          <span class="i" aria-hidden="true">!</span>
          <div>
            <p class="b">Dikkat · Üssün üssü</p>
            <p class="m">2³·2² = 2⁵ = 32 (üsler toplanır), (2³)² = 2⁶ = 64 (üsler çarpılır). İkisini yan yana ezberle.</p>
          </div>
        </div>
      </div>
    </div>
  </div>

  <div class="alt">
    <button class="buton" type="button">Yoklamaya başla
      <span class="ok"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg></span>
    </button>
    <button class="yazi" type="button">Haritaya dön</button>
  </div>
</div>
<script>
  // Kart başlıkları: lib/konu/icerik/9-matematik.ts → mat9-uslu-koklu
  const basliklar = ['Üslü ifade', 'Sıfırıncı ve negatif üs', 'Aynı tabanda işlem', 'Üssün üssü',
    'Farklı taban, aynı üs', 'Bilimsel gösterim', 'Köklü ifade', 'Kök ile üs aynı şey', 'Köklülerde işlem',
    'Paydayı rasyonel yapma', 'Dikkat: √(a²) = |a|', 'Negatif tabanın kuvveti', 'Üslü denklem',
    'Kök dışına çıkarma', 'Köklüleri toplama'];
  const ILK = 2; // kapalıyken görünen kart sayısı
  const ilk = document.getElementById('liste-ilk');
  const kalan = document.getElementById('liste-kalan');
  basliklar.forEach((b, i) => {
    const li = document.createElement('li');
    if (i >= ILK) li.style.animationDelay = Math.min(i - ILK, 7) * 32 + 'ms';
    li.innerHTML = '<span class="no rakam">' + (i + 1) + '</span><span class="ad"></span>';
    li.querySelector('.ad').textContent = b;
    (i < ILK ? ilk : kalan).appendChild(li);
  });

  const kart = document.getElementById('kart');
  const devam = document.getElementById('devam');
  const devamYazi = document.getElementById('devam-yazi');
  devam.addEventListener('click', () => {
    const acik = kart.dataset.acik !== 'true';
    kart.dataset.acik = acik;
    devam.setAttribute('aria-expanded', acik);
    devamYazi.textContent = acik ? 'Daha az göster' : 'Devamını gör';
  });
  if (location.hash === '#acik') devam.click();
</script>
</body>
</html>
